<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
  <title>From evidence to decision</title>
  <desc>Evidence is collected and numbered, an AI drafts a brief, a guardrail checks every number, id and district, the system fills counts and engine numbers, an officer accepts or rejects, and the decision is stored in a hash-chained log. A failed check falls back to a rule-based brief.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#131033"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.6" stop-color="#f472b6"/>
      <stop offset="0.8" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#fca5a5"/>
    </marker>
    <style>
      .n { font-size: 15px; font-weight: 800; fill: #0b1020; }
      .tt { font-size: 16px; font-weight: 700; fill: #f1f5f9; }
      .dd { font-size: 12.5px; fill: #94a3b8; }
      .card2 { fill: #111a35; stroke: #26355f; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1600" height="470" fill="url(#bg2)"/>
  <rect width="1600" height="470" fill="url(#grid2)"/>

  <text x="56" y="62" fill="#f8fafc" font-size="28" font-weight="800">From evidence to decision</text>
  <text x="58" y="90" fill="#94a3b8" font-size="15">How a Command Center brief is made, checked and decided. The AI never computes a number and never decides.</text>

  <!-- rail -->
  <rect x="96" y="148" width="1410" height="6" rx="3" fill="url(#rail)" opacity="0.9"/>

  <!-- steps: centers at 150, 380, 610, 840, 1070, 1300 ... width 210 -->
  <g filter="url(#sh2)">
    <!-- 1 -->
    <circle cx="160" cy="151" r="24" fill="#38bdf8"/><text x="160" y="157" text-anchor="middle" class="n">1</text>
    <rect x="56" y="196" width="208" height="170" rx="14" class="card2"/>
    <text x="74" y="226" class="tt">Collect evidence</text>
    <text x="74" y="252" class="dd">alerts · gauge levels</text>
    <text x="74" y="272" class="dd">district flood levels</text>
    <text x="74" y="292" class="dd">engine's tested numbers</text>
    <g transform="translate(74 312)">
      <rect width="34" height="24" rx="6" fill="#0c4a6e"/><text x="17" y="17" text-anchor="middle" fill="#bae6fd" font-size="12" font-weight="700">E1</text>
      <rect x="40" width="34" height="24" rx="6" fill="#0c4a6e"/><text x="57" y="17" text-anchor="middle" fill="#bae6fd" font-size="12" font-weight="700">E2</text>
      <rect x="80" width="34" height="24" rx="6" fill="#0c4a6e"/><text x="97" y="17" text-anchor="middle" fill="#bae6fd" font-size="12" font-weight="700">E3</text>
      <text x="124" y="17" fill="#7dd3fc" font-size="13" font-weight="700">…</text>
    </g>

    <!-- 2 -->
    <circle cx="400" cy="151" r="24" fill="#a78bfa"/><text x="400" y="157" text-anchor="middle" class="n">2</text>
    <rect x="296" y="196" width="208" height="170" rx="14" class="card2"/>
    <text x="314" y="226" class="tt">AI drafts</text>
    <text x="314" y="252" class="dd">Groq writes fixed JSON:</text>
    <text x="314" y="272" class="dd">situation · worst · actions</text>
    <text x="314" y="292" class="dd">check first · uncertainty</text>
    <text x="314" y="320" fill="#c4b5fd" font-size="12.5" font-weight="600">every line cites E-ids</text>
    <text x="314" y="342" class="dd">mode sets wording only</text>

    <!-- 3 -->
    <circle cx="640" cy="151" r="24" fill="#f472b6"/><text x="640" y="157" text-anchor="middle" class="n">3</text>
    <rect x="536" y="196" width="208" height="170" rx="14" class="card2" stroke="#f472b6" stroke-opacity="0.7"/>
    <text x="554" y="226" class="tt">Guardrail checks</text>
    <text x="554" y="252" class="dd">✓ numbers exist in evidence</text>
    <text x="554" y="272" class="dd">✓ cited ids are real</text>
    <text x="554" y="292" class="dd">✓ district is watched</text>
    <text x="554" y="312" class="dd">✓ format, ≤ 5 actions</text>
    <text x="554" y="340" fill="#fbcfe8" font-size="12.5" font-weight="600">any fail → rules write it</text>

    <!-- 4 -->
    <circle cx="880" cy="151" r="24" fill="#c084fc"/><text x="880" y="157" text-anchor="middle" class="n">4</text>
    <rect x="776" y="196" width="208" height="170" rx="14" class="card2"/>
    <text x="794" y="226" class="tt">System fills in</text>
    <text x="794" y="252" class="dd">district &amp; alert counts</text>
    <text x="794" y="272" class="dd">engine numbers per action</text>
    <text x="794" y="292" class="dd">(gain · cost · what breaks)</text>
    <text x="794" y="312" class="dd">"EXERCISE" line if simulated</text>
    <text x="794" y="340" fill="#e9d5ff" font-size="12.5" font-weight="600">the AI is never trusted</text>
    <text x="794" y="358" fill="#e9d5ff" font-size="12.5" font-weight="600">with numbers</text>

    <!-- 5 -->
    <circle cx="1120" cy="151" r="24" fill="#4ade80"/><text x="1120" y="157" text-anchor="middle" class="n">5</text>
    <rect x="1016" y="196" width="208" height="170" rx="14" fill="#0f2a1d" stroke="#4ade80" stroke-opacity="0.8" stroke-width="1.4"/>
    <text x="1034" y="226" class="tt">Officer decides</text>
    <text x="1034" y="252" class="dd">reads the brief and</text>
    <text x="1034" y="272" class="dd">the evidence under it</text>
    <g transform="translate(1034 292)">
      <rect width="80" height="28" rx="8" fill="#16a34a"/><text x="40" y="19" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="700">✓ Accept</text>
      <rect x="88" width="80" height="28" rx="8" fill="#7f1d1d"/><text x="128" y="19" text-anchor="middle" fill="#fecaca" font-size="12.5" font-weight="700">✕ Reject</text>
    </g>
    <text x="1034" y="348" class="dd">+ optional note</text>

    <!-- 6 -->
    <circle cx="1360" cy="151" r="24" fill="#fbbf24"/><text x="1360" y="157" text-anchor="middle" class="n">6</text>
    <rect x="1256" y="196" width="288" height="170" rx="14" fill="#241a05" stroke="#f59e0b" stroke-opacity="0.8"/>
    <text x="1274" y="226" class="tt">Hash-chained log</text>
    <text x="1274" y="252" class="dd">who · when · action · evidence</text>
    <text x="1274" y="272" class="dd">SHA-256(previous hash + row)</text>
    <g transform="translate(1274 288)" fill="none" stroke="#fbbf24" stroke-width="2.4">
      <rect width="44" height="22" rx="11"/><rect x="34" width="44" height="22" rx="11"/>
      <rect x="68" width="44" height="22" rx="11"/><rect x="102" width="44" height="22" rx="11"/>
    </g>
    <text x="1274" y="340" fill="#fde68a" font-size="12.5" font-weight="600">/audit: "chain intact" or the</text>
    <text x="1274" y="358" fill="#fde68a" font-size="12.5" font-weight="600">first row that was changed</text>
  </g>

  <!-- fallback loop from guardrail back over to step 4 -->
  <path d="M640 366 C 640 420, 880 420, 880 372" fill="none" stroke="#fca5a5" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ar2)"/>
  <text x="760" y="440" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="600">rejected AI text → rule-based brief from the same evidence</text>
</svg>
