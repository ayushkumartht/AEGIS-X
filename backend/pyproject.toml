[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis"
version = "0.2.0"
description = "AEGIS-X: test the decision before reality does."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
]

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
