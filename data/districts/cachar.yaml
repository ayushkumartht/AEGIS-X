id: cachar
name: Cachar (Silchar), Assam
# lon_min, lat_min, lon_max, lat_max: the Silchar urban area on the Barak river.
bbox: [92.74, 24.78, 92.84, 24.88]
# OSM spells the river "Barāk" (with a macron), so `name` is a case-insensitive regex.
river:
  name: "Bar[aā]k"
# Census 2011: 172,709 in Silchar municipality (silchar.assamurban.in) and 178,865 with its
# outgrowths (citypopulation.de); the box covers the outgrowths. No ward-level counts are
# published online, so people per area are spread in proportion to road length.
population_total: 178865
population_note: "Census 2011 total for Silchar municipality with outgrowths (178,865); spread over the area in proportion to road length, as ward counts are not published."
forecast_points:
  - {id: silchar, lat: 24.83, lon: 92.78}
# Boat bases. Coordinates are assumptions near the town centre and the river bank: replace
# with the real EOC / NDRF / SDRF locations.
staging_points:
  - {id: sp_centre, name: "Town centre base (assumed)", lat: 24.826, lon: 92.795}
  - {id: sp_north, name: "North bank base (assumed)", lat: 24.855, lon: 92.785}
# Boats and vehicles available to the district. ASSUMED numbers: replace with the EOC / IDRN inventory.
resources:
  boats: 12
  vehicles: 6
  note: "Assumed: no district boat inventory is published. In June 2022 an Army team brought 9 boats to Silchar and the rest were pooled from NDRF, SDRF, Army and CRPF (press reports). Replace with the EOC / IDRN inventory."
shelters_csv: data/reference/cachar_shelters.csv
events:
  - {id: silchar_2022, start: "2022-06-10", end: "2022-06-30"}
