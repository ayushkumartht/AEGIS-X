# Districts the Command Center watches. Flood-prone districts on India's major flood rivers
# (Brahmaputra, Barak, Ganga, Kosi, Gandak, Mahanadi, Godavari, Krishna, Jhelum, Rapti).
# lat/lon: the district headquarters town; the river cell used for GloFAS is searched around it
# (aegis/ops/districts.py). `console`: the id of a built AEGIS-X scenario, if there is one.
#
# Risk level thresholds (share of GloFAS ensemble members that exceed a flood flow in 7 days):
levels:
  probability: 0.3        # a level applies when at least this share of members exceed its flow
  severe_return_years: 20
  warning_return_years: 5
  watch_return_years: 2
history:
  start: "2005-01-01"
  min_years: 10

districts:
